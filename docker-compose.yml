services:
  postgres:
    # Same Postgres 17, plus the pgvector extension precompiled in — the
    # plain postgres image doesn't ship it, and CREATE EXTENSION vector
    # would fail without it. Neon (production) supports pgvector natively.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telegram_bot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
